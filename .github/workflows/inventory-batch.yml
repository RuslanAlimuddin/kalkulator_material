name: Uji Reservasi Massal Inventaris

on:
  push:
    branches:
      - pengembangan-mesin-hitung
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-reservation:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pasang dependensi
        run: npm install
      - name: Uji reservasi massal dan rollback
        run: node tests/inventory-storage-batch.test.js
