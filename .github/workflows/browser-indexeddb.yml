name: Uji IndexedDB Browser Nyata

on:
  push:
    branches:
      - pengembangan-mesin-hitung
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-indexeddb:
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pasang dependensi proyek
        run: npm install
      - name: Pasang Playwright
        run: npm install --no-save playwright
      - name: Pasang Chromium dan dependensi sistem
        run: npx playwright install --with-deps chromium
      - name: Uji persistensi IndexedDB asli
        run: node tests/browser/indexeddb.test.js
      - name: Uji pemulihan snapshot setelah browser ditutup
        run: node tests/browser/inventory-plan-recovery.test.js
      - name: Uji antarmuka inventaris pada Chromium
        run: node tests/browser/inventory-ui.test.js
